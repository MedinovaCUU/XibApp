<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>XibApp</title>
    <meta
      name="description"
      content="XibApp: entrenamiento, nutricion y progreso."
    />
    <meta name="theme-color" content="#0f1322" />
    <link rel="icon" type="image/png" href="./assets/xibapp-logo-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Oxanium:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background-orb orb-a"></div>
    <div class="background-orb orb-b"></div>
    <div class="background-orb orb-c"></div>

    <div id="app" class="app-root">
      <div class="boot-screen glass-panel">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-mark-base">
              <span class="brand-mark-solid"></span>
              <span class="brand-mark-grecas"></span>
            </span>
          </div>
          <div>
            <h1>XibApp</h1>
          </div>
        </div>
        <p class="boot-copy">Cargando...</p>
      </div>
    </div>

    <noscript>
      <div class="noscript-banner">
        Activa JavaScript para usar XibApp.
      </div>
    </noscript>

    <script type="module" src="./app.js"></script>
  </body>
</html>
