<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>XibApp Web</title>
    <meta
      name="description"
      content="XibApp Web: entrenamiento, ejercicios, nutricion, retos y progreso dentro del navegador."
    />
    <meta name="theme-color" content="#111a1a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Oxanium:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background-orb orb-a"></div>
    <div class="background-orb orb-b"></div>
    <div class="background-orb orb-c"></div>

    <div id="app" class="app-root">
      <div class="boot-screen glass-panel">
        <div class="brand-lockup">
          <div class="brand-mark">X</div>
          <div>
            <p class="eyebrow">Browser Edition</p>
            <h1>XibApp Web</h1>
          </div>
        </div>
        <p class="boot-copy">
          Cargando entrenamiento, ejercicios, nutricion y progreso para navegador.
        </p>
      </div>
    </div>

    <noscript>
      <div class="noscript-banner">
        Esta version de XibApp necesita JavaScript para funcionar en el navegador.
      </div>
    </noscript>

    <script type="module" src="./app.js"></script>
  </body>
</html>
